name: import-library
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip library batches
        run: |
          for z in lib-*.zip; do unzip -o "$z"; done
          rm -f lib-*.zip
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import tokiwacafe library"
          git push
